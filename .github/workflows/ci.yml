name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          cd packages/goal-studio-core
          pip install -e ".[dev]"
      - name: Lint
        run: |
          cd packages/goal-studio-core
          ruff check src tests
      - name: Type check
        run: |
          cd packages/goal-studio-core
          mypy src
      - name: Test
        run: |
          cd packages/goal-studio-core
          pytest --cov=goal_studio

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install
        run: |
          cd packages/goal-studio-web
          pnpm install
      - name: Type check
        run: |
          cd packages/goal-studio-web
          pnpm typecheck
      - name: Test
        run: |
          cd packages/goal-studio-web
          pnpm test
