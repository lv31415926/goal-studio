[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-studio-server"
version = "0.1.0"
description = "goal-studio FastAPI 后端 — REST + WebSocket 实时通信"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "goal-studio contributors" }]
dependencies = [
    "goal-studio",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goal_studio_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 与 core 包保持一致; B008 为 FastAPI Depends 参数默认值惯例,忽略
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
