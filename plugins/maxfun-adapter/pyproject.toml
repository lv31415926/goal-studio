[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-studio-maxfun-adapter"
version = "0.1.0"
description = "goal-studio ↔ maxfun 双向桥接器"
requires-python = ">=3.11"
authors = [{name = "goal-studio"}]
license = {text = "Apache-2.0"}

[project.entry-points."goal_studio.adapters"]
maxfun = "maxfun_bridge:MaxfunBridgeAdapter"

[tool.setuptools]
packages = ["."]
py-modules = ["maxfun_bridge", "__init__"]
